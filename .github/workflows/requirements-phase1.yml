name: Community requirements phase one
on:
  push:
    branches:
      - feature/requirements-matrix-phase1
  pull_request:
    branches:
      - release/poster-preview-only
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check public/app.js
          node --check public/community-extras.js
          node --check tests/requirements-matrix.test.js
      - name: Full regression suite
        run: npm test
